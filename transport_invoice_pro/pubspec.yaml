name: transport_invoice_pro
description: "Transport Invoice Pro - Production-ready transport invoicing and management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Backend & Cloud Services
  supabase_flutter: ^2.6.0

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Document Generation & Printing
  pdf: ^3.10.10
  printing: ^5.13.1

  # Utilities & Helpers
  intl: ^0.19.0
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  uuid: ^4.4.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"

flutter:
  uses-material-design: true
  # Assets declaration placeholder structure
  assets:
    - assets/images/
    - assets/icons/
